<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>预约管理 · 全端同步</title>
    <style>
      body {
        font-family: system-ui;
        background: #f5efe6;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        margin-bottom: 20px;
      }
      .login-card {
        text-align: center;
      }
      .login-card input {
        width: 100%;
        max-width: 260px;
        padding: 14px;
        border-radius: 40px;
        border: 1px solid #e0d0c0;
        text-align: center;
        margin-bottom: 15px;
      }
      .login-card button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 40px;
        cursor: pointer;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .nav-bar a {
        background: white;
        padding: 8px 16px;
        border-radius: 40px;
        text-decoration: none;
        color: #c23b22;
      }
      .booking-item {
        background: #fef9f0;
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 12px;
        border: 1px solid #f0e4d4;
      }
      .action-btn {
        background: #27ae60;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 20px;
        margin-right: 8px;
        cursor: pointer;
      }
      .delete-btn {
        background: #c23b22;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loginPanel" class="card login-card">
        <h1>🔐 预约管理后台</h1>
        <input type="password" id="password" placeholder="管理密码" />
        <button onclick="login()">进入</button>
        <div style="margin-top: 16px">
          <a href="kuaile-1.html" target="_blank">🏠 返回前台</a>
        </div>
      </div>
      <div id="adminPanel" style="display: none">
        <div class="nav-bar">
          <a href="kuaile-1.html">🏠 前台</a><a href="kuaile-2.html">📝 菜单</a
          ><a href="kuaile-4.html">📋 订单</a
          ><button
            onclick="logout()"
            style="
              background: #8b7355;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 40px;
            "
          >
            退出
          </button>
        </div>
        <div class="card">
          <h2>📅 预约记录</h2>
          <div id="bookingList"></div>
        </div>
      </div>
    </div>
    <script>
      const ADMIN_PASSWORD = "kuaile123";
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";
      let bookings = [];

      async function loadBookings() {
        try {
          const res = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            { headers: { "X-Master-Key": API_KEY } },
          );
          const data = await res.json();
          bookings = data.record?.bookings || [];
          renderBookings();
        } catch (e) {
          console.log(e);
        }
      }
      async function saveBookings() {
        try {
          const res = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            { headers: { "X-Master-Key": API_KEY } },
          );
          const full = await res.json();
          const record = full.record || {};
          record.bookings = bookings;
          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": API_KEY,
            },
            body: JSON.stringify(record),
          });
        } catch (e) {}
      }
      function updateStatus(id, newStatus) {
        let b = bookings.find((b) => b.id === id);
        if (b) {
          b.status = newStatus;
          saveBookings();
          renderBookings();
        }
      }
      function renderBookings() {
        let html = bookings.length
          ? bookings
              .map(
                (b) =>
                  `<div class="booking-item"><b>${b.name}</b> ${b.phone}<br>${b.date || "-"} ${b.time || ""}<br><span>状态：${b.status || "待确认"}</span><br><button class="action-btn" onclick="updateStatus(${b.id},'已确认')">✓ 确认</button><button class="action-btn delete-btn" onclick="updateStatus(${b.id},'已取消')">✗ 取消</button></div>`,
              )
              .join("")
          : "暂无预约";
        document.getElementById("bookingList").innerHTML = html;
      }
      function login() {
        let pwd = document.getElementById("password").value;
        if (pwd === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminLoggedIn", "true");
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          loadBookings();
          setInterval(loadBookings, 8000);
        } else alert("密码错误");
      }
      function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        location.reload();
      }
      if (sessionStorage.getItem("adminLoggedIn") === "true") {
        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadBookings();
        setInterval(loadBookings, 8000);
      }
    </script>
  </body>
</html>

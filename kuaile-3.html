<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>预约管理 · 全端同步</title>
    <style>
      body {
        font-family: system-ui;
        background: #f5efe6;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📅 预约记录</h2>
      <div id="bookingList"></div>
    </div>
    <script>
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";

      async function load() {
        const res = await fetch(
          `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
          {
            headers: { "X-Master-Key": API_KEY },
          },
        );
        const data = await res.json();
        const list = data.record?.bookings || [];
        document.getElementById("bookingList").innerHTML =
          list
            .map((b) => `<div>${b.name} ${b.phone} ${b.date}</div>`)
            .join("") || "暂无预约";
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>

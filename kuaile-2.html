<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>菜单管理 · 全端同步</title>
    <style>
      body {
        font-family: system-ui;
        background: #f5efe6;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      input,
      button {
        margin: 6px;
        padding: 8px;
      }
      .menu-item {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #ddd;
        padding: 8px 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📝 菜单管理（全端同步）</h2>
      <div id="menuList"></div>
      <button id="saveBtn">💾 保存并同步</button>
    </div>
    <script>
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";

      let menuData = {};

      async function loadMenu() {
        const res = await fetch(
          `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
          {
            headers: { "X-Master-Key": API_KEY },
          },
        );
        const data = await res.json();
        menuData = data.record?.menuData || {
          推荐: [{ name: "海蚌炖土鸭", price: 188, img: "" }],
        };
        render();
      }

      function render() {
        let html = "";
        for (let cat in menuData) {
          html += `<h3>${cat}</h3>`;
          menuData[cat].forEach((item, idx) => {
            html += `<div class="menu-item">
                            <input value="${item.name}" data-cat="${cat}" data-idx="${idx}" class="name">
                            <input value="${item.price}" data-cat="${cat}" data-idx="${idx}" class="price">
                            <button class="del" data-cat="${cat}" data-idx="${idx}">删除</button>
                         </div>`;
          });
          html += `<button class="add-item" data-cat="${cat}">+ 加菜</button>`;
        }
        document.getElementById("menuList").innerHTML = html;
      }

      async function saveMenu() {
        document.querySelectorAll(".name").forEach((inp) => {
          let cat = inp.dataset.cat;
          let idx = inp.dataset.idx;
          if (menuData[cat]?.[idx]) menuData[cat][idx].name = inp.value;
        });
        document.querySelectorAll(".price").forEach((inp) => {
          let cat = inp.dataset.cat;
          let idx = inp.dataset.idx;
          if (menuData[cat]?.[idx])
            menuData[cat][idx].price = Number(inp.value);
        });
        const full = { menuData };
        for (let i = 1; i <= 10; i++) full[`cart_${i}`] = [];
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY,
          },
          body: JSON.stringify(full),
        });
        alert("✅ 菜单已同步到所有设备");
      }

      document.getElementById("saveBtn").onclick = saveMenu;
      loadMenu();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 - 菜单管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, "Segoe UI", "PingFang SC", Roboto, sans-serif;
        background: #f5efe6;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .login-card {
        text-align: center;
      }
      .login-card h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }
      .login-card input {
        width: 100%;
        max-width: 260px;
        padding: 14px;
        border: 1px solid #e0d0c0;
        border-radius: 40px;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 15px;
      }
      .login-card button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 40px;
        font-size: 1rem;
        cursor: pointer;
      }
      .error {
        color: #c23b22;
        margin-top: 12px;
        font-size: 0.85rem;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .nav-bar a {
        color: #c23b22;
        text-decoration: none;
        padding: 8px 16px;
        background: white;
        border-radius: 40px;
        font-size: 0.9rem;
      }
      .nav-bar button {
        background: #8b7355;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 40px;
        cursor: pointer;
      }
      h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }
      .sort-hint {
        font-size: 0.7rem;
        color: #8b7355;
        margin-left: 10px;
      }
      .warning-msg {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 12px 16px;
        margin-bottom: 20px;
        border-radius: 12px;
        font-size: 0.85rem;
        color: #856404;
      }

      /* 分类拖拽容器 */
      .categories-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .category-item {
        background: white;
        border: 1px solid #f0e4d4;
        border-radius: 20px;
        padding: 16px;
        cursor: grab;
      }
      .category-item:active {
        cursor: grabbing;
      }
      .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0e4d4;
      }
      .category-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .drag-cat-handle {
        cursor: grab;
        background: #f0e4d4;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 1.2rem;
        color: #8b7355;
      }
      .drag-cat-handle:active {
        cursor: grabbing;
      }
      .category-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: #c23b22;
      }
      .delete-cat-btn {
        background: #c23b22;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.7rem;
        cursor: pointer;
      }
      /* 菜品拖拽列表 */
      .sortable-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .sortable-item {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
        flex-wrap: wrap;
        background: #fef9f0;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid #f0e4d4;
      }
      .drag-handle {
        cursor: grab;
        background: #e8dccc;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 1rem;
        color: #8b7355;
        user-select: none;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .sortable-item input {
        flex: 2;
        padding: 8px 10px;
        border: 1px solid #e0d0c0;
        border-radius: 10px;
        font-size: 0.85rem;
      }
      .sortable-item input.price {
        flex: 1;
        min-width: 70px;
      }
      .sortable-item input.unit {
        flex: 0.6;
        min-width: 50px;
      }
      .sortable-item input.img-url {
        flex: 2;
        font-size: 0.75rem;
      }
      .sortable-item button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.75rem;
      }
      .add-category-btn,
      .add-item-btn {
        background: #27ae60;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 30px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .add-category-btn {
        background: #d4953a;
        margin-bottom: 20px;
      }
      .save-all {
        background: #c23b22;
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 40px;
        font-size: 1rem;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
      }
      .success-msg {
        color: #27ae60;
        margin-top: 12px;
        text-align: center;
        display: none;
      }
      .new-category-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .new-category-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #e0d0c0;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>

        <h1>🔐 筷乐小院 · 后台管理</h1>
        <input type="password" id="password" placeholder="请输入管理密码" />
        <button onclick="login()">进入管理</button>
        <div id="loginError" class="error"></div>
        <div style="margin-top: 16px; font-size: 0.7rem; color: #8b7355">
          <a href="kuaile-1.html" target="_blank" style="color: #c23b22"
            >🏠 返回前台</a
          >
        </div>
      </div>

      <div id="adminPanel" style="display: none">
        <div class="nav-bar">
          <a href="kuaile-1.html" target="_blank">🏠 前台点菜</a>
          <a href="kuaile-3.html" target="_blank">📅 预约管理</a>
          <a href="kuaile-4.html" target="_blank">📋 订单管理</a>
          <button onclick="logout()">🚪 退出登录</button>
        </div>
        <div class="card">
          <h1>
            📝 菜单管理
            <span class="sort-hint">💡 拖拽左侧 ⋮⋮ 可调整分类或菜品顺序</span>
          </h1>
          <div class="warning-msg">
            💡 提示：价格请输入纯数字（如
            188），系统会自动显示。单位：份/个/只/斤。
          </div>
          <div id="menuEditor"></div>
          <button class="add-category-btn" onclick="showAddCategory()">
            + 添加新分类
          </button>
          <div
            id="newCategoryDiv"
            style="display: none"
            class="new-category-input"
          >
            <input
              type="text"
              id="newCategoryName"
              placeholder="新分类名称，如：凉菜系列"
            />
            <button onclick="addCategory()">确认添加</button>
            <button onclick="hideAddCategory()">取消</button>
          </div>
          <button class="save-all" onclick="saveAll()">💾 保存所有修改</button>
          <div id="saveMsg" class="success-msg">
            ✅ 保存成功！前台会自动更新
          </div>
        </div>
      </div>
    </div>

    <script>

        ],

        ],
        "🍚 主食·小吃": [
          { name: "炒面", price: 0, unit: "时价", img: "" },
          { name: "手工水饺", price: 0, unit: "时价", img: "" },
          { name: "手工麻糍", price: 0, unit: "时价", img: "" },
        ],
      };

      function loadData() {
        const saved = localStorage.getItem("kuaileMenu");
        if (saved) {
          menuData = JSON.parse(saved);
        } else {
          menuData = JSON.parse(JSON.stringify(defaultMenu));
        }
      }

      function destroySortableInstances() {
        if (categorySortable) categorySortable.destroy();
        itemSortables.forEach((s) => {
          if (s && s.destroy) s.destroy();
        });
        itemSortables = [];
      }

      function renderEditor() {
        const container = document.getElementById("menuEditor");
        container.innerHTML = "";

        const categoriesContainer = document.createElement("div");
        categoriesContainer.className = "categories-container";
        categoriesContainer.id = "categoriesContainer";

        for (const [category, items] of Object.entries(menuData)) {
          const categoryDiv = document.createElement("div");
          categoryDiv.className = "category-item";
          categoryDiv.setAttribute("data-category", category);

          categoryDiv.innerHTML = `
                <div class="category-header">
                    <div class="category-title">
                        <div class="drag-cat-handle">⋮⋮</div>
                        <span class="category-name">${escapeHtml(category)}</span>
                    </div>
                    <button class="delete-cat-btn" data-category="${escapeHtml(category)}">删除分类</button>
                </div>
            `;

          // 菜品列表容器
          const listContainer = document.createElement("ul");
          listContainer.className = "sortable-list";
          listContainer.setAttribute("data-category", category);

          items.forEach((item, idx) => {
            const listItem = document.createElement("li");
            listItem.className = "sortable-item";
            listItem.setAttribute("data-idx", idx);
            const priceDisplay = item.price || 0;
            const unitDisplay = item.unit || "份";
            listItem.innerHTML = `
                    <div class="drag-handle">⋮⋮</div>
                    <input type="text" class="name-input" value="${escapeHtml(item.name)}" placeholder="菜名" style="flex:2">
                    <input type="number" class="price-input" value="${priceDisplay}" placeholder="价格" class="price" style="flex:1; min-width:70px">
                    <input type="text" class="unit-input" value="${unitDisplay}" placeholder="单位" class="unit" style="flex:0.6; min-width:50px">
                    <input type="text" class="img-input" value="${escapeHtml(item.img || "")}" placeholder="图片URL" class="img-url" style="flex:2">
                    <button class="delete-item-btn">删除</button>
                `;
            listContainer.appendChild(listItem);
          });

          categoryDiv.appendChild(listContainer);

          const addBtn = document.createElement("button");
          addBtn.className = "add-item-btn";
          addBtn.innerHTML = "+ 添加菜品到 " + category;
          addBtn.onclick = () => addItem(category);
          categoryDiv.appendChild(addBtn);

          categoriesContainer.appendChild(categoryDiv);
        }

        container.appendChild(categoriesContainer);

        // 初始化分类拖拽
        const catContainer = document.getElementById("categoriesContainer");
        if (catContainer) {
          categorySortable = new Sortable(catContainer, {
            handle: ".drag-cat-handle",
            animation: 300,
            onEnd: () => {
              // 重新排序 menuData
              const newMenuData = {};
              catContainer
                .querySelectorAll(".category-item")
                .forEach((catDiv) => {
                  const catName = catDiv.getAttribute("data-category");
                  if (menuData[catName]) {
                    newMenuData[catName] = menuData[catName];
                  }
                });
              // 清空并重新赋值
              Object.keys(menuData).forEach((k) => delete menuData[k]);
              Object.assign(menuData, newMenuData);
              saveToLocal();
            },
          });
        }

        // 初始化每个分类内的菜品拖拽
        document.querySelectorAll(".sortable-list").forEach((list) => {
          const category = list.getAttribute("data-category");
          const sortable = new Sortable(list, {
            handle: ".drag-handle",
            animation: 300,
            onEnd: function () {
              const newOrder = [];
              list.querySelectorAll(".sortable-item").forEach((item) => {
                const nameInput = item.querySelector(".name-input");
                const priceInput = item.querySelector(".price-input");
                const unitInput = item.querySelector(".unit-input");
                const imgInput = item.querySelector(".img-input");
                newOrder.push({
                  name: nameInput.value,
                  price: parseFloat(priceInput.value) || 0,
                  unit: unitInput.value || "份",
                  img: imgInput.value,
                });
              });
              menuData[category] = newOrder;
              saveToLocal();
            },
          });
          itemSortables.push(sortable);
        });

        // 绑定删除分类事件
        document.querySelectorAll(".delete-cat-btn").forEach((btn) => {
          btn.onclick = () => {
            const catName = btn.getAttribute("data-category");
            if (confirm(`确定删除整个分类「${catName}」吗？`)) {
              delete menuData[catName];
              renderEditor();
            }
          };
        });

        // 绑定删除菜品事件
        document.querySelectorAll(".delete-item-btn").forEach((btn) => {
          btn.onclick = (e) => {
            const listItem = btn.closest(".sortable-item");
            const listContainer = listItem.parentElement;
            const category = listContainer.getAttribute("data-category");
            const idx = Array.from(listContainer.children).indexOf(listItem);
            if (confirm("确定删除这道菜吗？")) {
              menuData[category].splice(idx, 1);
              renderEditor();
            }
          };
        });
      }

      function saveToLocal() {
        localStorage.setItem("kuaileMenu", JSON.stringify(menuData));
        window.dispatchEvent(
          new StorageEvent("storage", {
            key: "kuaileMenu",
            newValue: JSON.stringify(menuData),
          }),
        );
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, (m) =>
          m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
        );
      }

      function addItem(category) {
        menuData[category].push({
          name: "新菜品",
          price: 0,
          unit: "份",
          img: "",
        });
        renderEditor();
      }

      function showAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "flex";
      }

      function hideAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "none";
        document.getElementById("newCategoryName").value = "";
      }

      function addCategory() {
        const newName = document.getElementById("newCategoryName").value.trim();
        if (!newName) {
          alert("请输入分类名称");
          return;
        }
        if (menuData[newName]) {
          alert("该分类已存在");
          return;
        }
        menuData[newName] = [];
        hideAddCategory();
        renderEditor();
      }

      function saveAll() {
        // 收集所有输入框的值
        document.querySelectorAll(".sortable-list").forEach((list) => {
          const category = list.getAttribute("data-category");
          const newOrder = [];
          list.querySelectorAll(".sortable-item").forEach((item) => {
            const nameInput = item.querySelector(".name-input");
            const priceInput = item.querySelector(".price-input");
            const unitInput = item.querySelector(".unit-input");
            const imgInput = item.querySelector(".img-input");
            newOrder.push({
              name: nameInput.value,
              price: parseFloat(priceInput.value) || 0,
              unit: unitInput.value || "份",
              img: imgInput.value,
            });
          });
          if (menuData[category]) {
            menuData[category] = newOrder;
          }
        });

        saveToLocal();

        const msg = document.getElementById("saveMsg");
        msg.style.display = "block";
        setTimeout(() => {
          msg.style.display = "none";
        }, 2000);
      }

      function login() {
        const pwd = document.getElementById("password").value;
        if (pwd === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminLoggedIn", "true");
          loadData();
          renderEditor();
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
        } else {
          document.getElementById("loginError").innerText = "密码错误，请重试";
        }
      }

      function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        document.getElementById("loginPanel").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("password").value = "";
        document.getElementById("loginError").innerText = "";
      }
    </script>

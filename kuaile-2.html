<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 - 菜单管理后台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, "Segoe UI", "PingFang SC", Roboto, sans-serif;
        background: #f5efe6;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      .login-card {
        text-align: center;
      }

      .login-card h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }

      .login-card input {
        width: 100%;
        max-width: 260px;
        padding: 14px;
        border: 1px solid #e0d0c0;
        border-radius: 40px;
        font-size: 1rem;
        text-align: center;
        margin-bottom: 15px;
      }

      .login-card button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 40px;
        font-size: 1rem;
        cursor: pointer;
      }

      .error {
        color: #c23b22;
        margin-top: 12px;
        font-size: 0.85rem;
      }

      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-bar a {
        color: #c23b22;
        text-decoration: none;
        padding: 8px 16px;
        background: white;
        border-radius: 40px;
        font-size: 0.9rem;
      }

      .nav-bar button {
        background: #8b7355;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 40px;
        cursor: pointer;
      }

      h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }

      .category {
        margin-bottom: 30px;
        border-top: 2px solid #f0e4d4;
        padding-top: 20px;
      }

      .category h2 {
        color: #c23b22;
        margin-bottom: 15px;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .menu-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .menu-row input {
        flex: 2;
        padding: 10px 12px;
        border: 1px solid #e0d0c0;
        border-radius: 12px;
        font-size: 0.9rem;
      }

      .menu-row input.price {
        flex: 1;
        min-width: 80px;
      }

      .menu-row input.unit {
        flex: 0.8;
        min-width: 60px;
      }

      .menu-row input.img-url {
        flex: 2;
        font-size: 0.8rem;
      }

      .menu-row button {
        background: #d4953a;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .menu-row button.delete {
        background: #c23b22;
      }

      .add-category-btn,
      .add-item-btn {
        background: #27ae60;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        margin-top: 12px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .add-category-btn {
        background: #d4953a;
        margin-bottom: 20px;
      }

      .save-all {
        background: #c23b22;
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 40px;
        font-size: 1rem;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
      }

      .success-msg {
        color: #27ae60;
        margin-top: 12px;
        text-align: center;
        display: none;
      }

      .new-category-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .new-category-input input {
        flex: 1;
        padding: 10px;
        border: 1px solid #e0d0c0;
        border-radius: 12px;
      }

      .warning-msg {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 12px 16px;
        margin-bottom: 20px;
        border-radius: 12px;
        font-size: 0.85rem;
        color: #856404;
      }

      hr {
        margin: 20px 0;
        border: none;
        border-top: 1px solid #f0e4d4;
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <div id="loginPanel" class="card login-card">
        <h1>🔐 筷乐小院 · 后台管理</h1>
        <input type="password" id="password" placeholder="请输入管理密码" />
        <button onclick="login()">进入管理</button>
        <div id="loginError" class="error"></div>
        <div style="margin-top: 16px; font-size: 0.7rem; color: #8b7355">
          <a href="kuaile-1.html" target="_blank" style="color: #c23b22"
            >🏠 返回前台</a
          >
        </div>
      </div>

      <div id="adminPanel" style="display: none">
        <div class="nav-bar">
          <a href="kuaile-1.html" target="_blank">🏠 前台点菜</a>
          <a href="kuaile-3.html" target="_blank">📅 预约管理</a>
          <a href="kuaile-4.html" target="_blank">📋 订单管理</a>
          <button onclick="logout()">🚪 退出登录</button>
        </div>
        <div class="card">
          <h1>📝 菜单管理</h1>
          <div class="warning-msg">
            💡 提示：价格请输入纯数字（如 188），系统会自动显示为 ¥188。<br />
            💡 单位：份（默认）/ 个 / 只 / 斤，会影响前台显示。
          </div>
          <div id="menuEditor"></div>

          <button class="add-category-btn" onclick="showAddCategory()">
            + 添加新分类
          </button>
          <div
            id="newCategoryDiv"
            style="display: none"
            class="new-category-input"
          >
            <input
              type="text"
              id="newCategoryName"
              placeholder="新分类名称，如：凉菜系列"
            />
            <button onclick="addCategory()">确认添加</button>
            <button onclick="hideAddCategory()">取消</button>
          </div>

          <button class="save-all" onclick="saveAll()">💾 保存所有修改</button>
          <div id="saveMsg" class="success-msg">
            ✅ 保存成功！前台会自动更新
          </div>
        </div>
      </div>
    </div>

    <script>
      const ADMIN_PASSWORD = "kuaile123";
      let menuData = null;

      // 默认菜单数据（数字价格 + 单位）
      const defaultMenu = {
        招牌必点: [
          {
            name: "海蚌炖土鸭",
            price: 188,
            unit: "份",
            img: "https://picsum.photos/200/150?random=10",
          },
          {
            name: "牛排锅",
            price: 188,
            unit: "份",
            img: "https://picsum.photos/200/150?random=11",
          },
          {
            name: "肥肠鸡",
            price: 158,
            unit: "份",
            img: "https://picsum.photos/200/150?random=12",
          },
        ],
        "炖罐·汤品": [
          {
            name: "三鲜汤",
            price: 98,
            unit: "份",
            img: "https://picsum.photos/200/150?random=20",
          },
          {
            name: "筒骨鱼丸汤",
            price: 88,
            unit: "份",
            img: "https://picsum.photos/200/150?random=21",
          },
        ],
        "干锅·硬菜": [
          {
            name: "干锅三腊",
            price: 78,
            unit: "份",
            img: "https://picsum.photos/200/150?random=40",
          },
          {
            name: "干锅肥肠",
            price: 58,
            unit: "份",
            img: "https://picsum.photos/200/150?random=41",
          },
        ],
      };

      function loadData() {
        const saved = localStorage.getItem("kuaileMenu");
        if (saved) {
          menuData = JSON.parse(saved);
        } else {
          menuData = JSON.parse(JSON.stringify(defaultMenu));
        }
      }

      function formatPrice(price, unit) {
        return `¥${price}${unit && unit !== "份" ? "/" + unit : ""}`;
      }

      function renderEditor() {
        const container = document.getElementById("menuEditor");
        container.innerHTML = "";

        for (const [category, items] of Object.entries(menuData)) {
          const categoryDiv = document.createElement("div");
          categoryDiv.className = "category";

          // 使用 data-cat 存储分类名，避免特殊字符问题
          const catDisplay = category;
          categoryDiv.innerHTML = `
                <h2>
                    ${escapeHtml(catDisplay)}
                    <button class="delete-cat-btn" style="background:#c23b22; padding:4px 12px; font-size:0.7rem; border:none; border-radius:20px; color:white; cursor:pointer;">删除分类</button>
                </h2>
            `;

          items.forEach((item, idx) => {
            const row = document.createElement("div");
            row.className = "menu-row";
            row.setAttribute("data-cat", category);
            row.setAttribute("data-idx", idx);
            row.innerHTML = `
                    <input type="text" class="name-input" value="${escapeHtml(item.name)}" placeholder="菜名" style="flex:2">
                    <input type="number" class="price-input" value="${item.price}" placeholder="价格" class="price" style="flex:1; min-width:80px">
                    <input type="text" class="unit-input" value="${item.unit || "份"}" placeholder="单位" class="unit" style="flex:0.8; min-width:60px">
                    <input type="text" class="img-input" value="${escapeHtml(item.img || "")}" placeholder="图片URL" class="img-url" style="flex:2">
                    <button class="delete-item-btn" style="background:#c23b22;">删除</button>
                `;
            categoryDiv.appendChild(row);
          });

          const addBtn = document.createElement("button");
          addBtn.className = "add-item-btn";
          addBtn.innerHTML = "+ 添加菜品到 " + category;
          addBtn.onclick = () => addItem(category);
          categoryDiv.appendChild(addBtn);

          container.appendChild(categoryDiv);
        }

        // 绑定删除分类事件
        document.querySelectorAll(".delete-cat-btn").forEach((btn, idx) => {
          const catName = Object.keys(menuData)[idx];
          btn.onclick = () => deleteCategory(catName);
        });

        // 绑定删除菜品事件
        document.querySelectorAll(".delete-item-btn").forEach((btn) => {
          btn.onclick = (e) => {
            const row = btn.closest(".menu-row");
            const category = row.getAttribute("data-cat");
            const idx = parseInt(row.getAttribute("data-idx"));
            if (confirm("确定删除这道菜吗？")) {
              menuData[category].splice(idx, 1);
              renderEditor();
            }
          };
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function (m) {
          if (m === "&") return "&amp;";
          if (m === "<") return "&lt;";
          if (m === ">") return "&gt;";
          return m;
        });
      }

      function deleteCategory(category) {
        if (
          confirm(
            `确定删除整个分类「${category}」吗？里面的所有菜品也会被删除。`,
          )
        ) {
          delete menuData[category];
          renderEditor();
        }
      }

      function addItem(category) {
        menuData[category].push({
          name: "新菜品",
          price: 0,
          unit: "份",
          img: "https://picsum.photos/200/150?random=new",
        });
        renderEditor();
      }

      function showAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "flex";
      }

      function hideAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "none";
        document.getElementById("newCategoryName").value = "";
      }

      function addCategory() {
        const newName = document.getElementById("newCategoryName").value.trim();
        if (!newName) {
          alert("请输入分类名称");
          return;
        }
        if (menuData[newName]) {
          alert("该分类已存在");
          return;
        }
        menuData[newName] = [];
        hideAddCategory();
        renderEditor();
      }

      function saveAll() {
        // 收集所有输入框的值
        const rows = document.querySelectorAll(".menu-row");

        rows.forEach((row) => {
          const category = row.getAttribute("data-cat");
          const idx = parseInt(row.getAttribute("data-idx"));
          const nameInput = row.querySelector(".name-input");
          const priceInput = row.querySelector(".price-input");
          const unitInput = row.querySelector(".unit-input");
          const imgInput = row.querySelector(".img-input");

          if (menuData[category] && menuData[category][idx]) {
            menuData[category][idx].name = nameInput.value;
            menuData[category][idx].price = parseFloat(priceInput.value) || 0;
            menuData[category][idx].unit = unitInput.value || "份";
            menuData[category][idx].img = imgInput.value;
          }
        });

        localStorage.setItem("kuaileMenu", JSON.stringify(menuData));

        const msg = document.getElementById("saveMsg");
        msg.style.display = "block";
        setTimeout(() => {
          msg.style.display = "none";
        }, 2000);

        // 触发前台更新
        window.dispatchEvent(
          new StorageEvent("storage", {
            key: "kuaileMenu",
            newValue: JSON.stringify(menuData),
          }),
        );
      }

      function login() {
        const pwd = document.getElementById("password").value;
        if (pwd === ADMIN_PASSWORD) {
          loadData();
          renderEditor();
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
        } else {
          document.getElementById("loginError").innerText = "密码错误，请重试";
        }
      }

      function logout() {
        document.getElementById("loginPanel").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("password").value = "";
        document.getElementById("loginError").innerText = "";
      }
    </script>
  </body>
</html>

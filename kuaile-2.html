<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 - 菜单管理后台（全端同步）</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f5efe6;
        padding: 20px;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .login-card {
        text-align: center;
      }
      .login-card h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }
      .login-card input {
        width: 100%;
        max-width: 260px;
        padding: 14px;
        border: 1px solid #e0d0c0;
        border-radius: 40px;
        text-align: center;
        margin-bottom: 15px;
      }
      .login-card button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 40px;
        cursor: pointer;
      }
      .error {
        color: #c23b22;
        margin-top: 12px;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .nav-bar a,
      .nav-bar button {
        background: white;
        padding: 8px 16px;
        border-radius: 40px;
        text-decoration: none;
        color: #c23b22;
        border: none;
        cursor: pointer;
      }
      h1 {
        color: #c23b22;
        margin-bottom: 20px;
      }
      .sort-hint {
        font-size: 0.7rem;
        color: #8b7355;
        margin-left: 10px;
      }
      .warning-msg {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 12px;
      }
      .categories-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .category-item {
        background: white;
        border: 1px solid #f0e4d4;
        border-radius: 20px;
        padding: 16px;
        cursor: grab;
      }
      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 2px solid #f0e4d4;
        padding-bottom: 10px;
      }
      .category-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .drag-cat-handle {
        background: #f0e4d4;
        padding: 4px 10px;
        border-radius: 8px;
        cursor: grab;
      }
      .category-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: #c23b22;
      }
      .delete-cat-btn {
        background: #c23b22;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 20px;
        cursor: pointer;
      }
      .sortable-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .sortable-item {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        background: #fef9f0;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid #f0e4d4;
        margin-bottom: 10px;
        align-items: center;
      }
      .drag-handle {
        background: #e8dccc;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: grab;
        user-select: none;
      }
      .sortable-item input {
        flex: 2;
        padding: 8px 10px;
        border: 1px solid #e0d0c0;
        border-radius: 10px;
      }
      .sortable-item input.price {
        flex: 1;
        min-width: 70px;
      }
      .sortable-item input.unit {
        flex: 0.6;
        min-width: 50px;
      }
      .sortable-item input.img-url {
        flex: 2;
      }
      .sortable-item button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .add-item-btn,
      .add-category-btn {
        background: #27ae60;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 30px;
        margin-top: 12px;
        cursor: pointer;
      }
      .add-category-btn {
        background: #d4953a;
        margin-bottom: 20px;
      }
      .save-all {
        background: #c23b22;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 40px;
        width: 100%;
        margin-top: 20px;
        cursor: pointer;
        font-size: 1rem;
      }
      .success-msg {
        color: #27ae60;
        text-align: center;
        margin-top: 12px;
        display: none;
      }
      .new-category-input {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .new-category-input input {
        flex: 1;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid #e0d0c0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loginPanel" class="card login-card">
        <h1>🔐 筷乐小院 · 后台管理</h1>
        <input type="password" id="password" placeholder="管理密码" />
        <button onclick="login()">进入管理</button>
        <div id="loginError" class="error"></div>
        <div style="margin-top: 16px">
          <a href="kuaile-1.html" target="_blank" style="color: #c23b22"
            >🏠 返回前台</a
          >
        </div>
      </div>

      <div id="adminPanel" style="display: none">
        <div class="nav-bar">
          <a href="kuaile-1.html">🏠 前台点菜</a>
          <a href="kuaile-3.html">📅 预约管理</a>
          <a href="kuaile-4.html">📋 订单管理</a>
          <button onclick="logout()">🚪 退出</button>
        </div>
        <div class="card">
          <h1>
            📝 菜单管理 <span class="sort-hint">💡 拖拽 ⋮⋮ 调整顺序</span>
          </h1>
          <div class="warning-msg">💡 价格填数字，单位：份/个/只/斤</div>
          <div id="menuEditor"></div>
          <button class="add-category-btn" onclick="showAddCategory()">
            + 新分类
          </button>
          <div
            id="newCategoryDiv"
            style="display: none"
            class="new-category-input"
          >
            <input type="text" id="newCategoryName" placeholder="分类名" />
            <button onclick="addCategory()">确认</button>
            <button onclick="hideAddCategory()">取消</button>
          </div>
          <button class="save-all" onclick="saveAll()">
            💾 保存并同步到云端
          </button>
          <div id="saveMsg" class="success-msg">
            ✅ 已保存并同步，所有设备生效
          </div>
        </div>
      </div>
    </div>

    <script>
      const ADMIN_PASSWORD = "kuaile123";
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";

      let menuData = null;
      let categorySortable = null;
      let itemSortables = [];

      if (sessionStorage.getItem("adminLoggedIn") === "true") {
        document.getElementById("loginPanel").style.display = "none";
        document.getElementById("adminPanel").style.display = "block";
        loadData();
        renderEditor();
      }

      const defaultMenu = {
        "🍲 招牌必点": [
          { name: "海蚌炖土鸭", price: 188, unit: "份", img: "" },
        ],
        "🥣 炖罐·汤品": [{ name: "三鲜汤", price: 98, unit: "份", img: "" }],
      };

      function loadData() {
        const saved = localStorage.getItem("kuaileMenu");
        menuData = saved
          ? JSON.parse(saved)
          : JSON.parse(JSON.stringify(defaultMenu));
      }

      async function syncMenuToCloud() {
        try {
          const full = { menuData };
          for (let i = 1; i <= 10; i++) {
            const cart = localStorage.getItem(`cart_${i}`);
            if (cart) full[`cart_${i}`] = JSON.parse(cart);
          }
          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": API_KEY,
            },
            body: JSON.stringify(full),
          });
        } catch (e) {
          console.log("云端同步失败", e);
        }
      }

      function saveToLocalAndCloud() {
        localStorage.setItem("kuaileMenu", JSON.stringify(menuData));
        syncMenuToCloud();
        window.dispatchEvent(
          new StorageEvent("storage", {
            key: "kuaileMenu",
            newValue: JSON.stringify(menuData),
          }),
        );
      }

      function renderEditor() {
        const container = document.getElementById("menuEditor");
        container.innerHTML = "";
        const catContainer = document.createElement("div");
        catContainer.className = "categories-container";
        catContainer.id = "categoriesContainer";

        for (const [cat, items] of Object.entries(menuData)) {
          const catDiv = document.createElement("div");
          catDiv.className = "category-item";
          catDiv.setAttribute("data-category", cat);
          catDiv.innerHTML = `
                <div class="category-header">
                    <div class="category-title"><div class="drag-cat-handle">⋮⋮</div><span class="category-name">${escapeHtml(cat)}</span></div>
                    <button class="delete-cat-btn">删除分类</button>
                </div>
            `;
          const list = document.createElement("ul");
          list.className = "sortable-list";
          list.setAttribute("data-category", cat);
          items.forEach((item) => {
            const li = document.createElement("li");
            li.className = "sortable-item";
            li.innerHTML = `
                    <div class="drag-handle">⋮⋮</div>
                    <input class="name-input" value="${escapeHtml(item.name)}" placeholder="菜名" style="flex:2">
                    <input class="price-input" value="${item.price}" placeholder="价格" class="price" style="flex:1">
                    <input class="unit-input" value="${item.unit || "份"}" placeholder="单位" class="unit" style="flex:0.6">
                    <input class="img-input" value="${escapeHtml(item.img || "")}" placeholder="图片URL" class="img-url" style="flex:2">
                    <button class="delete-item-btn">删除</button>
                `;
            list.appendChild(li);
          });
          catDiv.appendChild(list);
          const addBtn = document.createElement("button");
          addBtn.className = "add-item-btn";
          addBtn.innerText = "+ 添加菜品到 " + cat;
          addBtn.onclick = () => {
            menuData[cat].push({
              name: "新菜品",
              price: 0,
              unit: "份",
              img: "",
            });
            renderEditor();
          };
          catDiv.appendChild(addBtn);
          catContainer.appendChild(catDiv);
        }
        container.appendChild(catContainer);

        if (categorySortable) categorySortable.destroy();
        categorySortable = new Sortable(
          document.getElementById("categoriesContainer"),
          {
            handle: ".drag-cat-handle",
            animation: 300,
            onEnd: () => {
              const newOrder = {};
              document.querySelectorAll(".category-item").forEach((el) => {
                const name = el.getAttribute("data-category");
                if (menuData[name]) newOrder[name] = menuData[name];
              });
              menuData = newOrder;
              saveToLocalAndCloud();
            },
          },
        );

        itemSortables.forEach((s) => s.destroy());
        itemSortables = [];
        document.querySelectorAll(".sortable-list").forEach((list) => {
          const cat = list.getAttribute("data-category");
          const sort = new Sortable(list, {
            handle: ".drag-handle",
            animation: 300,
            onEnd: () => {
              const newItems = [];
              list.querySelectorAll(".sortable-item").forEach((li) => {
                newItems.push({
                  name: li.querySelector(".name-input").value,
                  price:
                    parseFloat(li.querySelector(".price-input").value) || 0,
                  unit: li.querySelector(".unit-input").value || "份",
                  img: li.querySelector(".img-input").value || "",
                });
              });
              if (menuData[cat]) menuData[cat] = newItems;
              saveToLocalAndCloud();
            },
          });
          itemSortables.push(sort);
        });

        document.querySelectorAll(".delete-cat-btn").forEach((btn) => {
          btn.onclick = () => {
            const catDiv = btn.closest(".category-item");
            const catName = catDiv.getAttribute("data-category");
            if (confirm(`删除分类「${catName}」？`)) {
              delete menuData[catName];
              renderEditor();
            }
          };
        });

        document.querySelectorAll(".delete-item-btn").forEach((btn) => {
          btn.onclick = () => {
            const li = btn.closest(".sortable-item");
            const list = li.parentElement;
            const category = list.getAttribute("data-category");
            const idx = Array.from(list.children).indexOf(li);
            if (confirm("删除这道菜？")) {
              menuData[category].splice(idx, 1);
              renderEditor();
            }
          };
        });
      }

      function saveAll() {
        document.querySelectorAll(".sortable-list").forEach((list) => {
          const cat = list.getAttribute("data-category");
          const newItems = [];
          list.querySelectorAll(".sortable-item").forEach((li) => {
            newItems.push({
              name: li.querySelector(".name-input").value,
              price: parseFloat(li.querySelector(".price-input").value) || 0,
              unit: li.querySelector(".unit-input").value || "份",
              img: li.querySelector(".img-input").value || "",
            });
          });
          if (menuData[cat]) menuData[cat] = newItems;
        });
        saveToLocalAndCloud();
        const msg = document.getElementById("saveMsg");
        msg.style.display = "block";
        setTimeout(() => (msg.style.display = "none"), 2000);
      }

      function showAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "flex";
      }
      function hideAddCategory() {
        document.getElementById("newCategoryDiv").style.display = "none";
        document.getElementById("newCategoryName").value = "";
      }
      function addCategory() {
        const newName = document.getElementById("newCategoryName").value.trim();
        if (!newName) return alert("请输入分类名");
        if (menuData[newName]) return alert("分类已存在");
        menuData[newName] = [];
        hideAddCategory();
        renderEditor();
      }

      function login() {
        const pwd = document.getElementById("password").value;
        if (pwd === ADMIN_PASSWORD) {
          sessionStorage.setItem("adminLoggedIn", "true");
          loadData();
          renderEditor();
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
        } else {
          document.getElementById("loginError").innerText = "密码错误";
        }
      }

      function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        location.reload();
      }
      function escapeHtml(str) {
        return String(str).replace(
          /[&<>]/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[m],
        );
      }
    </script>
  </body>
</html>

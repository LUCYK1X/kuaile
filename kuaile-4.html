<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 · 订单管理</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5efe6;
        padding: 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .login-card {
        text-align: center;
      }
      .login-card input {
        width: 100%;
        max-width: 260px;
        padding: 14px;
        border: 1px solid #e0d0c0;
        border-radius: 40px;
        margin: 10px;
      }
      .login-card button,
      .action-btn {
        background: #c23b22;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 40px;
        cursor: pointer;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .nav-bar a {
        color: #c23b22;
        text-decoration: none;
        background: white;
        padding: 8px 16px;
        border-radius: 40px;
      }
      .stats {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: #fff5ea;
        border-radius: 20px;
        padding: 12px 20px;
        flex: 1;
        text-align: center;
      }
      .stat-number {
        font-size: 1.6rem;
        font-weight: bold;
        color: #c23b22;
      }
      .order-item {
        background: white;
        border: 1px solid #f0e4d4;
        border-radius: 20px;
        padding: 16px;
        margin-bottom: 12px;
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .order-table {
        background: #c23b22;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
      }
      .order-status {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
      }
      .status-pending {
        background: #d4953a;
        color: white;
      }
      .status-confirmed {
        background: #27ae60;
        color: white;
      }
      .status-completed {
        background: #8b7355;
        color: white;
      }
      .order-items {
        margin: 12px 0;
        padding-left: 12px;
        border-left: 2px solid #f0e4d4;
      }
      .order-total {
        text-align: right;
        font-weight: bold;
        color: #c23b22;
        margin-top: 8px;
      }
      .order-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }
      .btn-confirm {
        background: #27ae60;
      }
      .btn-complete {
        background: #8b7355;
      }
      .empty {
        text-align: center;
        padding: 40px;
        color: #8b7355;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.7rem;
        color: #8b7355;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loginPanel" class="card login-card">
        <h1>🔐 订单管理后台</h1>
        <input type="password" id="password" placeholder="管理密码" />
        <button onclick="login()">进入</button>
        <div id="loginError" style="color: #c23b22; margin-top: 10px"></div>
        <div style="margin-top: 16px">
          <a href="kuaile-1.html" target="_blank">🏠 返回前台</a>
        </div>
      </div>

      <div id="adminPanel" style="display: none">
        <div class="nav-bar">
          <a href="kuaile-1.html" target="_blank">🏠 前台点菜</a>
          <a href="kuaile-2.html" target="_blank">📝 菜单管理</a>
          <a href="kuaile-3.html" target="_blank">📅 预约管理</a>
          <button onclick="logout()">🚪 退出</button>
        </div>
        <div class="card">
          <h1>📋 点菜订单</h1>
          <div class="stats" id="stats"></div>
          <div id="orderList"></div>
        </div>
        <div class="footer">订单实时刷新，确认后通知厨房</div>
      </div>
    </div>

    <script>
      const PASSWORD = "kuaile123";
      let orders = [];

      function loadOrders() {
        const saved = localStorage.getItem("kuaileOrders");
        orders = saved ? JSON.parse(saved) : [];
        orders.sort((a, b) => b.id - a.id);
        renderStats();
        renderOrders();
      }

      function renderStats() {
        const pending = orders.filter((o) => o.status === "待处理").length;
        const confirmed = orders.filter((o) => o.status === "已确认").length;
        document.getElementById("stats").innerHTML = `
            <div class="stat-card"><div class="stat-number">${orders.length}</div><div>总订单</div></div>
            <div class="stat-card"><div class="stat-number">${pending}</div><div>待处理</div></div>
            <div class="stat-card"><div class="stat-number">${confirmed}</div><div>已确认</div></div>
        `;
      }

      function renderOrders() {
        const container = document.getElementById("orderList");
        if (orders.length === 0) {
          container.innerHTML = '<div class="empty">📭 暂无订单</div>';
          return;
        }
        container.innerHTML = orders
          .map((order) => {
            let statusClass = "";
            if (order.status === "待处理") statusClass = "status-pending";
            else if (order.status === "已确认")
              statusClass = "status-confirmed";
            else statusClass = "status-completed";

            return `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-table">🏠 ${order.table}号桌</span>
                        <span class="order-status ${statusClass}">${order.status}</span>
                    </div>
                    <div class="order-items">
                        ${order.items.map((item) => `<div>${escapeHtml(item.name)} x ${item.quantity} = ¥${item.price * item.quantity}</div>`).join("")}
                    </div>
                    <div class="order-total">总计：¥${order.total}</div>
                    <div style="font-size:0.7rem; color:#8b7355;">⏰ ${order.createTime}</div>
                    <div class="order-actions">
                        ${order.status === "待处理" ? `<button class="action-btn btn-confirm" onclick="updateOrderStatus(${order.id}, '已确认')">✓ 确认</button>` : ""}
                        ${order.status !== "已完成" ? `<button class="action-btn btn-complete" onclick="updateOrderStatus(${order.id}, '已完成')">✅ 完成</button>` : ""}
                    </div>
                </div>
            `;
          })
          .join("");
      }

      function updateOrderStatus(id, newStatus) {
        const order = orders.find((o) => o.id === id);
        if (order) {
          order.status = newStatus;
          localStorage.setItem("kuaileOrders", JSON.stringify(orders));
          loadOrders();
        }
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, (m) =>
          m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
        );
      }

      function login() {
        const pwd = document.getElementById("password").value;
        if (pwd === PASSWORD) {
          loadOrders();
          document.getElementById("loginPanel").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
        } else {
          document.getElementById("loginError").innerText = "密码错误";
        }
      }

      function logout() {
        document.getElementById("loginPanel").style.display = "block";
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("password").value = "";
      }
    </script>
  </body>
</html>

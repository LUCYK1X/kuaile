<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>订单管理 · 全端同步</title>
    <style>
      body {
        font-family: system-ui;
        background: #f5efe6;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>📋 全部订单</h2>
      <div id="orderList"></div>
    </div>
    <script>
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";

      async function load() {
        const res = await fetch(
          `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
          {
            headers: { "X-Master-Key": API_KEY },
          },
        );
        const data = await res.json();
        const record = data.record || {};
        let orders = [];
        for (let i = 1; i <= 10; i++) {
          let cart = record[`cart_${i}`] || [];
          if (cart.length)
            orders.push(`🏠 ${i}号桌：${cart.map((g) => g.name).join(",")}`);
        }
        document.getElementById("orderList").innerHTML =
          orders.map((o) => `<div>${o}</div>`).join("") || "暂无订单";
      }
      load();
      setInterval(load, 8000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 · 全端同步点菜</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f5efe6;
      }
      .page {
        max-width: 600px;
        margin: 0 auto;
        background: #fffcf8;
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .top-deco {
        height: 4px;
        background: #c23b22;
      }
      .header {
        text-align: center;
        padding: 20px;
        background: #c23b22;
        color: white;
      }
      .store-name {
        font-size: 1.8rem;
        font-weight: bold;
      }
      .table-info {
        background: #a0351e;
        display: inline-block;
        padding: 4px 16px;
        border-radius: 30px;
        margin-top: 10px;
      }
      .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 600px;
        margin: 0 auto;
        background: #2c2418;
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
        z-index: 100;
      }
      .category-nav {
        overflow-x: auto;
        white-space: nowrap;
        padding: 8px 16px;
        background: white;
        border-bottom: 1px solid #ddd;
        position: sticky;
        top: 0;
      }
      .category-item {
        display: inline-block;
        padding: 6px 16px;
        margin-right: 8px;
        background: #f0e4d4;
        border-radius: 30px;
        cursor: pointer;
      }
      .menu-item {
        display: flex;
        gap: 12px;
        background: white;
        border-radius: 16px;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #f0e4d4;
      }
      .menu-img {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        object-fit: cover;
        background: #eee;
      }
      .add-btn {
        background: #d4953a;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 30px;
        cursor: pointer;
      }
      .qty-btn {
        background: #f0e4d4;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
      }
      .booking-btn {
        background: #d4953a;
        color: white;
        padding: 12px;
        border-radius: 50px;
        width: calc(100% - 32px);
        margin: 16px;
        border: none;
        cursor: pointer;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
        opacity: 0;
        transition: 0.2s;
        z-index: 200;
      }
      .modal.show {
        visibility: visible;
        opacity: 1;
      }
      .modal-content {
        background: white;
        border-radius: 32px;
        width: 90%;
        max-width: 400px;
        padding: 24px;
        max-height: 80vh;
        overflow-y: auto;
      }
      button {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-deco"></div>
      <div class="header">
        <div class="store-name">筷乐小院</div>
        <div class="table-info" id="tableInfo">加载中...</div>
      </div>

      <div id="categoryNav" class="category-nav"></div>
      <div id="menuContainer"></div>

      <button class="booking-btn" id="bookingBtn">📅 预约订桌</button>
      <div class="cart-bar" id="cartBar">
        <span>🛒 购物车</span>
        <span id="cartTotalBtn">0元</span>
      </div>

      <div id="cartModal" class="modal">
        <div class="modal-content">
          <h3>🛒 我的点单</h3>
          <div id="cartItems"></div>
          <div style="margin: 12px 0"><span id="cartTotalPrice">0元</span></div>
          <button id="clearCartBtn" style="background: #8b7355">清空</button>
          <button id="submitOrderBtn" style="background: #c23b22">
            确认下单
          </button>
          <button class="close-modal" id="closeCartBtn">继续点菜</button>
        </div>
      </div>

      <div id="bookingModal" class="modal">
        <div class="modal-content">
          <h3>预约订桌</h3>
          <input type="text" id="bookingName" placeholder="姓名" />
          <input type="tel" id="bookingPhone" placeholder="电话" />
          <input type="date" id="bookingDate" />
          <select id="bookingTime">
            <option>18:00</option>
            <option>19:00</option>
          </select>
          <button id="submitBooking">提交预约</button>
          <button class="close-modal" id="closeModal">取消</button>
        </div>
      </div>
    </div>

    <script>
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";
      const table = new URLSearchParams(location.search).get("table") || "1";
      document.getElementById("tableInfo").innerText = `🏠 ${table}号桌`;

      let cart = [];
      let menuData = null;

      async function syncAll() {
        try {
          const res = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            {
              headers: { "X-Master-Key": API_KEY },
            },
          );
          const data = await res.json();
          const record = data.record || {};
          if (record.menuData) menuData = record.menuData;
          cart = record[`cart_${table}`] || [];
          localStorage.setItem(`cart_${table}`, JSON.stringify(cart));
          renderMenu();
          updateCartUI();
        } catch (e) {
          console.log("同步失败", e);
        }
      }

      async function pushToCloud() {
        const full = { menuData, bookings: [], orders: [] };
        for (let i = 1; i <= 10; i++)
          full[`cart_${i}`] = JSON.parse(
            localStorage.getItem(`cart_${i}`) || "[]",
          );
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": API_KEY,
            },
            body: JSON.stringify(full),
          });
        } catch (e) {}
      }

      function saveCart() {
        localStorage.setItem(`cart_${table}`, JSON.stringify(cart));
        pushToCloud();
      }

      function addToCart(name, price, img) {
        let item = cart.find((i) => i.name === name);
        if (item) item.quantity++;
        else cart.push({ name, price, quantity: 1, img });
        saveCart();
        renderMenu();
        updateCartUI();
      }

      function removeFromCart(name) {
        let idx = cart.findIndex((i) => i.name === name);
        if (idx !== -1) {
          if (cart[idx].quantity > 1) cart[idx].quantity--;
          else cart.splice(idx, 1);
          saveCart();
          renderMenu();
          updateCartUI();
        }
      }

      function updateCartUI() {
        let total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById("cartTotalBtn").innerText = total + "元";
        document.getElementById("cartTotalPrice").innerText = total + "元";
        let html = cart
          .map(
            (i) =>
              `<div>${i.name} x ${i.quantity} = ${i.price * i.quantity}元 <button onclick="removeFromCart('${i.name}')">-</button></div>`,
          )
          .join("");
        document.getElementById("cartItems").innerHTML = html || "空";
      }

      function renderMenu() {
        if (!menuData) return;
        let html = "";
        for (let cat in menuData) {
          html += `<div class="section-title">${cat}</div>`;
          menuData[cat].forEach((d) => {
            let q = cart.find((i) => i.name === d.name)?.quantity || 0;
            html += `<div class="menu-item">
                            <img class="menu-img" src="${d.img || "https://picsum.photos/70/70"}">
                            <div><b>${d.name}</b> ${d.price}元</div>
                            ${
                              q === 0
                                ? `<button class="add-btn" onclick="addToCart('${d.name}',${d.price},'${d.img}')">点菜</button>`
                                : `<button class="qty-btn" onclick="removeFromCart('${d.name}')">-</button> ${q} <button class="qty-btn" onclick="addToCart('${d.name}',${d.price},'${d.img}')">+</button>`
                            }
                        </div>`;
          });
        }
        document.getElementById("menuContainer").innerHTML = html;
      }

      document.getElementById("cartBar").onclick = () =>
        document.getElementById("cartModal").classList.add("show");
      document.getElementById("closeCartBtn").onclick = () =>
        document.getElementById("cartModal").classList.remove("show");
      document.getElementById("clearCartBtn").onclick = () => {
        cart = [];
        saveCart();
        renderMenu();
        updateCartUI();
      };
      document.getElementById("submitOrderBtn").onclick = () => {
        if (!cart.length) return alert("空单");
        alert(`✅ ${table}号桌 下单成功`);
        cart = [];
        saveCart();
        renderMenu();
        updateCartUI();
        document.getElementById("cartModal").classList.remove("show");
      };

      const modal = document.getElementById("bookingModal");
      document.getElementById("bookingBtn").onclick = () =>
        modal.classList.add("show");
      document.getElementById("closeModal").onclick = () =>
        modal.classList.remove("show");
      document.getElementById("submitBooking").onclick = () => {
        alert("预约已提交");
        modal.classList.remove("show");
      };

      syncAll();
      setInterval(syncAll, 8000);
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>筷乐小院 · 扫码点菜</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f5efe6;
      }
      .page {
        max-width: 600px;
        margin: 0 auto;
        background: #fffcf8;
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .top-deco {
        height: 4px;
        background: linear-gradient(90deg, #c23b22, #d4953a, #c23b22);
      }
      .header {
        text-align: center;
        padding: 30px 20px;
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.2)),
          url("https://picsum.photos/800/300?random=1");
        background-size: cover;
        color: white;
      }
      .store-name {
        font-size: 2rem;
        font-weight: bold;
      }
      .divider {
        width: 50px;
        height: 2px;
        background: #d4953a;
        margin: 12px auto;
      }
      .info-card {
        background: white;
        margin: 16px;
        padding: 12px;
        border-radius: 16px;
      }
      .status-badge {
        background: #c23b22;
        color: white;
        padding: 4px 14px;
        border-radius: 30px;
        display: inline-block;
      }
      .quick-links {
        display: flex;
        gap: 12px;
        margin: 16px;
      }
      .quick-btn {
        flex: 1;
        background: #fff5ea;
        text-align: center;
        padding: 12px;
        border-radius: 40px;
        text-decoration: none;
        color: #c23b22;
        border: 1px solid #f0e0d0;
      }
      .section {
        margin: 20px 16px;
      }
      .section-title {
        font-size: 1.2rem;
        font-weight: bold;
        color: #c23b22;
        border-left: 3px solid #d4953a;
        padding-left: 12px;
        margin-bottom: 12px;
      }
      .room-card {
        background: white;
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #f0e4d4;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .menu-item {
        background: white;
        border-radius: 16px;
        border: 1px solid #f0e4d4;
        display: flex;
        gap: 12px;
        padding: 10px;
        margin-bottom: 10px;
        align-items: center;
      }
      .menu-img {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        object-fit: cover;
      }
      .add-btn {
        background: #d4953a;
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 30px;
        cursor: pointer;
      }
      .qty-btn {
        background: #f0e4d4;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
      }
      .booking-btn {
        background: #d4953a;
        color: white;
        border: none;
        padding: 12px;
        width: calc(100% - 32px);
        margin: 0 16px;
        border-radius: 50px;
        cursor: pointer;
      }
      .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 600px;
        margin: 0 auto;
        background: #2c2418;
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        cursor: pointer;
        z-index: 100;
      }
      .address-card {
        background: #fff5ea;
        margin: 12px 16px;
        padding: 12px;
        border-radius: 16px;
        text-align: center;
      }
      .footer-info {
        background: #2c2418;
        color: #d4c5ae;
        text-align: center;
        padding: 24px;
        margin-top: 20px;
      }
      .admin-link {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #c23b22;
        color: white;
        padding: 8px 16px;
        border-radius: 40px;
        font-size: 0.7rem;
        text-decoration: none;
        opacity: 0.6;
        z-index: 100;
      }
      .back-to-top {
        position: fixed;
        bottom: 80px;
        right: 20px;
        background: #c23b22;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 99;
      }
      .back-to-top.show {
        opacity: 1;
        visibility: visible;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        visibility: hidden;
        opacity: 0;
        transition: 0.2s;
      }
      .modal.show {
        visibility: visible;
        opacity: 1;
      }
      .modal-content {
        background: white;
        border-radius: 32px;
        width: 90%;
        max-width: 400px;
        padding: 24px;
        max-height: 80vh;
        overflow-y: auto;
        text-align: center;
      }
      .modal-content input,
      .modal-content select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 40px;
        border: 1px solid #f0e4d4;
      }
      .modal-content button {
        background: #c23b22;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 40px;
        margin-top: 8px;
        cursor: pointer;
      }
      button {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="top-deco"></div>
      <div class="header">
        <div class="store-name">筷乐小院</div>
        <div class="divider"></div>
        <div class="slogan">晚餐 · 夜宵 · 把酒言欢</div>
      </div>
      <div class="info-card">
        <span class="status-badge" id="statusBadge">● 营业中</span>
        <span style="float: right">15:00-02:00</span>
      </div>
      <div class="quick-links">
        <a href="tel:18960634499" class="quick-btn">📞 订餐</a
        ><a href="#" class="quick-btn" id="mapBtn">🗺️ 导航</a>
      </div>
      <div class="section">
        <div class="section-title">🏠 包厢·雅座</div>
        <div class="room-card">
          <span>🚪</span><span><b>独立包厢</b><br />6间 · 12-15人</span>
        </div>
        <div class="room-card">
          <span>🌳</span><span><b>露天雅座</b><br />3桌 · 6-8人</span>
        </div>
      </div>
      <div class="address-card">
        📍 福建省南平市浦城县兴华路295号<br />🅿️ 门口可停车 | 包厢请提前预订
      </div>
      <div id="menuContainer"></div>
      <button class="booking-btn" id="bookingBtn">📅 预约订桌</button>
      <div class="footer-info">
        <div>📞 189-6063-4499</div>
        <div>🕘 15:00 - 02:00</div>
        <div>© 2026 筷乐小院</div>
      </div>
      <div class="cart-bar" id="cartBar">
        <span>🛒 购物车</span
        ><span class="cart-total" id="cartTotalBtn">0元</span>
      </div>
      <div class="back-to-top" id="backToTopBtn">↑</div>

      <div id="cartModal" class="modal">
        <div class="modal-content">
          <h3>🛒 我的点单</h3>
          <div id="cartItems"></div>
          <div>
            <strong>总计：<span id="cartTotalPrice">0元</span></strong>
          </div>
          <button id="clearCartBtn">清空</button
          ><button id="submitOrderBtn">确认下单</button
          ><button class="close-modal" id="closeCartBtn">继续点菜</button>
        </div>
      </div>
      <div id="bookingModal" class="modal">
        <div class="modal-content">
          <h3>📝 预约订桌</h3>
          <input type="text" id="bookingName" placeholder="姓名" /><input
            type="tel"
            id="bookingPhone"
            placeholder="电话"
          /><input type="date" id="bookingDate" /><select id="bookingTime">
            <option>18:00</option>
            <option>19:00</option></select
          ><button id="submitBooking">提交预约</button
          ><button class="close-modal" id="closeModal">取消</button>
        </div>
      </div>
    </div>

    <script>
      const API_KEY =
        "$2a$10$PgGXF5wf9QCNRaOS7givO.s7OuhI413ZCbbZ5.Wsn1zcImORonYJO";
      const BIN_ID = "6a26a6ebf5f4af5e29cad51d";
      const table = new URLSearchParams(location.search).get("table") || "1";
      let menuData = null,
        cart = [];

      async function syncAll() {
        try {
          const res = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            { headers: { "X-Master-Key": API_KEY } },
          );
          const data = await res.json();
          const record = data.record || {};
          if (record.menuData) menuData = record.menuData;
          cart = record[`cart_${table}`] || [];
          renderMenu();
          updateCartUI();
        } catch (e) {
          console.log(e);
        }
      }
      async function pushCart() {
        try {
          const res = await fetch(
            `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,
            { headers: { "X-Master-Key": API_KEY } },
          );
          const full = await res.json();
          const record = full.record || {};
          record[`cart_${table}`] = cart;
          await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": API_KEY,
            },
            body: JSON.stringify(record),
          });
        } catch (e) {}
      }
      function addToCart(name, price, img) {
        let exist = cart.find((i) => i.name === name);
        if (exist) exist.quantity++;
        else cart.push({ name, price, quantity: 1, img });
        pushCart();
        renderMenu();
        updateCartUI();
      }
      function removeFromCart(name) {
        let idx = cart.findIndex((i) => i.name === name);
        if (idx !== -1) {
          if (cart[idx].quantity > 1) cart[idx].quantity--;
          else cart.splice(idx, 1);
          pushCart();
          renderMenu();
          updateCartUI();
        }
      }
      function updateCartUI() {
        let total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById("cartTotalBtn").innerText = total + "元";
        document.getElementById("cartTotalPrice").innerText = total + "元";
        document.getElementById("cartItems").innerHTML = cart.length
          ? cart
              .map(
                (i) =>
                  `<div>${i.name} x ${i.quantity} = ${i.price * i.quantity}元 <button onclick="removeFromCart('${i.name}')">-</button></div>`,
              )
              .join("")
          : "空";
      }
      function renderMenu() {
        if (!menuData) return;
        let html = "";
        for (let cat in menuData) {
          html += `<div class="section"><div class="section-title">${cat}</div>`;
          menuData[cat].forEach((d) => {
            let q = cart.find((i) => i.name === d.name)?.quantity || 0;
            html += `<div class="menu-item"><img class="menu-img" src="${d.img || "https://picsum.photos/70/70"}"><div><b>${d.name}</b> ${d.price}元</div>`;
            if (q === 0)
              html += `<button class="add-btn" onclick="addToCart('${d.name}',${d.price},'${d.img}')">点菜</button>`;
            else
              html += `<button class="qty-btn" onclick="removeFromCart('${d.name}')">-</button> ${q} <button class="qty-btn" onclick="addToCart('${d.name}',${d.price},'${d.img}')">+</button>`;
            html += `</div>`;
          });
          html += `</div>`;
        }
        document.getElementById("menuContainer").innerHTML = html;
      }
      function openMap() {
        window.location.href = `https://uri.amap.com/marker?position=118.541,27.917&name=筷乐小院&callnative=1`;
        setTimeout(
          () =>
            window.open(
              `https://www.amap.com/search?query=浦城县兴华路295号&city=南平`,
              "_blank",
            ),
          500,
        );
      }
      document.getElementById("mapBtn").onclick = (e) => {
        e.preventDefault();
        openMap();
      };
      document.getElementById("cartBar").onclick = () =>
        document.getElementById("cartModal").classList.add("show");
      document.getElementById("closeCartBtn").onclick = () =>
        document.getElementById("cartModal").classList.remove("show");
      document.getElementById("clearCartBtn").onclick = () => {
        cart = [];
        pushCart();
        renderMenu();
        updateCartUI();
        document.getElementById("cartModal").classList.remove("show");
      };
      document.getElementById("submitOrderBtn").onclick = () => {
        if (!cart.length) return alert("请先点菜");
        let orders = JSON.parse(localStorage.getItem("kuaileOrders") || "[]");
        orders.push({
          id: Date.now(),
          table,
          items: cart.map((i) => ({
            name: i.name,
            quantity: i.quantity,
            price: i.price,
          })),
          total: cart.reduce((s, i) => s + i.price * i.quantity, 0),
          status: "待处理",
          createTime: new Date().toLocaleString(),
        });
        localStorage.setItem("kuaileOrders", JSON.stringify(orders));
        alert(`✅ ${table}号桌 下单成功`);
        cart = [];
        pushCart();
        renderMenu();
        updateCartUI();
        document.getElementById("cartModal").classList.remove("show");
      };
      let modal = document.getElementById("bookingModal");
      document.getElementById("bookingBtn").onclick = () =>
        modal.classList.add("show");
      document.getElementById("closeModal").onclick = () =>
        modal.classList.remove("show");
      document.getElementById("submitBooking").onclick = () => {
        let name = document.getElementById("bookingName").value.trim(),
          phone = document.getElementById("bookingPhone").value.trim();
        if (!name || !phone) return alert("请填写姓名和电话");
        let bookings = JSON.parse(
          localStorage.getItem("kuaileBookings") || "[]",
        );
        bookings.push({
          id: Date.now(),
          name,
          phone,
          date: document.getElementById("bookingDate").value,
          time: document.getElementById("bookingTime").value,
          status: "待确认",
          createTime: new Date().toLocaleString(),
        });
        localStorage.setItem("kuaileBookings", JSON.stringify(bookings));
        alert("预约已提交");
        modal.classList.remove("show");
      };
      let backBtn = document.getElementById("backToTopBtn");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) backBtn.classList.add("show");
        else backBtn.classList.remove("show");
      });
      backBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
      function updateStatus() {
        let h = new Date().getHours();
        let badge = document.getElementById("statusBadge");
        if ((h >= 15 && h <= 23) || h === 0 || h === 1) {
          badge.innerHTML = "● 营业中";
          badge.style.background = "#c23b22";
        } else {
          badge.innerHTML = "● 休息中";
          badge.style.background = "#8b7355";
        }
      }
      updateStatus();
      setInterval(updateStatus, 60000);
      setInterval(syncAll, 8000);
      syncAll();
    </script>
  </body>
</html>
